<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>化学式检索 · Material Demo</title>
  <link rel="stylesheet" href="../material-demo.css">
</head>
<body>
  <div class="app-shell">
    <header class="top-app-bar"><div class="brand"><div class="brand-mark">SC</div><span>化学式检索</span></div><button class="button filled">搜索</button></header>
    <nav class="rail"><button class="rail-item">上传</button><button class="rail-item">审核</button><button class="rail-item active">检索</button><button class="rail-item">图谱</button><button class="rail-item">问答</button><button class="rail-item">预测</button><button class="rail-item">社区</button></nav>
    <main class="content">
      <section class="page-header">
        <div><p class="eyebrow">Formula Search</p><h1>用化学式快速定位体系</h1><p>支持模糊搜索，选中体系后进入结果表格并下载 JSON 或 RIS。</p></div>
        <button class="button outlined">清除</button>
      </section>
      <section class="grid two-col">
        <article class="card elevated">
          <h2>搜索输入</h2>
          <div class="field"><label>输入 Formula</label><strong>LaH</strong></div>
          <div class="toolbar" style="margin-top:16px"><span class="chip primary">LaH10</span><span class="chip">LaH6</span><span class="chip">LaH16</span><span class="chip secondary">相似结果</span></div>
          <div class="card filled" style="margin-top:20px"><h3>搜索规则</h3><p>化学式检索放在元素周期表检索上方，和元素组合模式保持视觉分离。</p></div>
        </article>
        <article class="card">
          <h2>候选体系</h2>
          <div class="table-wrap"><table class="data-table">
            <thead><tr><th>Formula</th><th>命中</th><th>最高 Tc</th><th>操作</th></tr></thead>
            <tbody>
              <tr class="selected"><td>LaH10</td><td>12</td><td>250 K</td><td><button class="button text">进入</button></td></tr>
              <tr><td>LaH6</td><td>4</td><td>180 K</td><td><button class="button text">进入</button></td></tr>
              <tr><td>LaH16</td><td>2</td><td>156 K</td><td><button class="button text">进入</button></td></tr>
            </tbody>
          </table></div>
        </article>
      </section>
    </main>
  </div>
  <div class="snackbar">已选择 LaH10</div>
</body>
</html>
