server {
    listen 80;

    # 论文 PDF 通常超过 Nginx 默认 1 MB 请求体上限。
    client_max_body_size 50M;

    # 前端静态文件
    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由支持
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 代理 → Go
    location /api/ {
        proxy_pass http://goserver:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 上传响应很小且由 XHR 直接解析；关闭上游压缩，避免代理链重写
    # Content-Encoding/Content-Length 后出现响应截断或 JSON 解析失败。
    location ~ ^/api/rag/upload-(pdf|text)$ {
        proxy_pass http://goserver:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Accept-Encoding "";
        proxy_request_buffering off;
    }

    # 健康检查
    location /health {
        proxy_pass http://goserver:8080;
    }
}
