<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SC-Wiki</title>
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="app-shell-body">
    <div class="sc-shell">
        <aside class="sc-sidebar" aria-label="SC-Wiki navigation" data-i18n-aria-label="nav.aria_label">
            <div class="sc-brand">
                <button class="sc-brand-mark" type="button" onclick="switchPage('/elements?view=hotspot')" aria-label="SC-Wiki home" data-i18n-aria-label="nav.home_aria">SC</button>
                <div>
                    <div class="sc-brand-name">SC-Wiki</div>
                    <div class="sc-brand-subtitle" data-i18n="nav.brand_subtitle">超导工作台</div>
                </div>
            </div>

            <nav class="sc-nav" id="navTabs">
                <a class="sc-nav-link active" href="#" data-page="/elements?view=hotspot" onclick="return switchPage('/elements?view=hotspot')">
                    <span class="sc-nav-icon">H</span>
                    <span>
                        <span class="sc-nav-title" data-i18n="nav.hotspot">超导热点</span>
                        <span class="sc-nav-note" data-i18n="nav.hotspot_note">Tc 与诺奖学者</span>
                    </span>
                </a>
                <a class="sc-nav-link" href="#" data-page="/elements" onclick="return switchPage('/elements')">
                    <span class="sc-nav-icon">X</span>
                    <span>
                        <span class="sc-nav-title" data-i18n="nav.explore">超导探索</span>
                        <span class="sc-nav-note" data-i18n="nav.explore_note">化学式与元素检索</span>
                    </span>
                </a>
                <a class="sc-nav-link" href="#" data-page="/compound" style="display:none;" onclick="return switchPage(this.dataset.url)">
                    <span class="sc-nav-icon">R</span>
                    <span>
                        <span class="sc-nav-title" data-i18n="nav.results">结果页</span>
                        <span class="sc-nav-note" data-i18n="nav.results_note">文献与数据</span>
                    </span>
                </a>
                <a class="sc-nav-link" href="#" data-page="/elements?view=share" onclick="return switchPage('/elements?view=share')">
                    <span class="sc-nav-icon">S</span>
                    <span>
                        <span class="sc-nav-title" data-i18n="nav.share">超导分享</span>
                        <span class="sc-nav-note" data-i18n="nav.share_note">下载与分享文献</span>
                    </span>
                </a>
                <a class="sc-nav-link" href="#" data-page="/rag" onclick="return switchPage('/rag')">
                    <span class="sc-nav-icon">C</span>
                    <span>
                        <span class="sc-nav-title" data-i18n="nav.chat">超导对话</span>
                        <span class="sc-nav-note" data-i18n="nav.chat_note">RAG 对话助手</span>
                    </span>
                </a>
                <a class="sc-nav-link" href="#" data-page="/tc-pre" onclick="return switchPage('/tc-pre')">
                    <span class="sc-nav-icon">P</span>
                    <span>
                        <span class="sc-nav-title" data-i18n="nav.predict">超导预测</span>
                        <span class="sc-nav-note" data-i18n="nav.predict_note">Tc 模型预测</span>
                    </span>
                </a>

                <div class="sc-nav-divider admin-only" style="display:none;"></div>
                <a class="sc-nav-link admin-only" href="#" data-page="/admin/papers" style="display:none;" data-role="admin" onclick="return switchPage('/admin/papers')">
                    <span class="sc-nav-icon">A</span>
                    <span>
                        <span class="sc-nav-title" data-i18n="nav.admin_papers">文献管理</span>
                        <span class="sc-nav-note" data-i18n="nav.admin_papers_note">审核与维护</span>
                    </span>
                </a>
                <a class="sc-nav-link admin-only" href="#" data-page="/admin/users" style="display:none;" data-role="superadmin" onclick="return switchPage('/admin/users')">
                    <span class="sc-nav-icon">U</span>
                    <span>
                        <span class="sc-nav-title" data-i18n="nav.admin_users">用户管理</span>
                        <span class="sc-nav-note" data-i18n="nav.admin_users_note">权限与审批</span>
                    </span>
                </a>
            </nav>

            <div class="sc-sidebar-footer">
                <div id="user-nav" class="sc-user-nav">
                    <div class="spinner-border spinner-border-sm" role="status"><span class="visually-hidden">Loading...</span></div>
                </div>
                <button class="sc-language-btn" onclick="toggleShellLanguage()" title="Switch Language" data-i18n-title="common.switch_language">中 / EN</button>
            </div>
        </aside>

        <main class="sc-main">
            <iframe id="page-frame" src="/elements?view=hotspot" title="SC-Wiki workspace" data-i18n-title="nav.frame_title"></iframe>
        </main>
    </div>

    <script src="/static/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/i18n.js"></script>
    <script src="/static/js/auth_state.js"></script>
    <script src="/static/js/auth_helper.js"></script>
    <script>
        function withEmbed(url) {
            var sep = url.indexOf('?') >= 0 ? '&' : '?';
            return url + sep + 'embed=1';
        }

        function setActiveNav(url) {
            document.querySelectorAll('#navTabs .sc-nav-link').forEach(function(link) {
                link.classList.toggle('active', link.dataset.page === url);
            });
        }

        function switchPage(url) {
            document.getElementById('page-frame').src = withEmbed(url);
            setActiveNav(url);
            return false;
        }

        function syncFrameLanguage() {
            var frame = document.getElementById('page-frame');
            try {
                if (frame.contentWindow && frame.contentWindow.I18N && window.I18N) {
                    frame.contentWindow.I18N.set(window.I18N.lang);
                }
            } catch(e) {}
        }

        function toggleShellLanguage() {
            I18N.toggle();
            syncFrameLanguage();
        }

        document.getElementById('page-frame').addEventListener('load', function() {
            var frame = document.getElementById('page-frame');
            var compoundTab = document.querySelector('[data-page="/compound"]');
            try {
                var frameUrl = frame.contentWindow.location.pathname;
                var frameSearch = frame.contentWindow.location.search;
                if (frameUrl.indexOf('/compound/') === 0) {
                    compoundTab.style.display = '';
                    compoundTab.dataset.url = frameUrl;
                    setActiveNav('/compound');
                } else if (frameUrl === '/elements' && frameSearch.indexOf('view=share') >= 0) {
                    setActiveNav('/elements?view=share');
                } else if (frameUrl === '/elements' && frameSearch.indexOf('view=hotspot') >= 0) {
                    setActiveNav('/elements?view=hotspot');
                } else if (frameUrl.indexOf('/admin/') === 0) {
                    setActiveNav(frameUrl);
                } else {
                    setActiveNav(frameUrl);
                }
                syncFrameLanguage();
            } catch(e) {}
        });

        function updateAdminNav() {
            var state = window.authState ? window.authState.get() : null;
            var isAdmin = state && state.user && state.user.is_admin;
            var isSuperAdmin = state && state.user && state.user.is_superadmin;
            var anyVisible = false;

            document.querySelectorAll('#navTabs .admin-only.sc-nav-link').forEach(function(link) {
                var role = link.dataset.role;
                var show = (role === 'superadmin' && isSuperAdmin) || (role === 'admin' && (isAdmin || isSuperAdmin));
                link.style.display = show ? '' : 'none';
                anyVisible = anyVisible || show;
            });
            document.querySelectorAll('#navTabs .sc-nav-divider.admin-only').forEach(function(divider) {
                divider.style.display = anyVisible ? '' : 'none';
            });
        }

        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(updateAdminNav, 200);
        });
        window.updateAdminNav = updateAdminNav;
    </script>
</body>
</html>
