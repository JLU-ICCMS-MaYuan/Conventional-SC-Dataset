<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>超导文献数据库</title>
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        html, body { height: 100%; margin: 0; overflow: hidden; }
        body { display: flex; flex-direction: column; }
        #page-frame { flex: 1; width: 100%; border: none; }
        #user-nav .btn { border: none !important; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#" onclick="switchPage('/elements')">超导文献数据库</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#masterNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="masterNav">
                <div class="nav-underline me-auto" id="navTabs">
                    <a class="nav-link active" href="#" data-page="/elements" onclick="return switchPage('/elements')">首页</a>
                    <a class="nav-link" href="#" data-page="/compound" style="display:none;" onclick="return switchPage(this.dataset.url)">化合物</a>
                    <a class="nav-link" href="#" data-page="/rag" onclick="return switchPage('/rag')">AI 文献助手</a>
                    <a class="nav-link" href="#" data-page="/tc-pre" onclick="return switchPage('/tc-pre')">Tc 预测</a>
                    <span class="nav-slider"></span>
                </div>
                <div class="d-flex align-items-center gap-2" id="user-nav">
                    <div class="spinner-border spinner-border-sm text-light"><span class="visually-hidden">Loading...</span></div>
                </div>
                <button class="btn btn-outline-light btn-sm ms-2" onclick="I18N.toggle()" title="Switch Language">中/EN</button>
            </div>
        </div>
    </nav>

    <iframe id="page-frame" src="/elements"></iframe>

    <script src="/static/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/i18n.js"></script>
    <script src="/static/js/auth_state.js"></script>
    <script src="/static/js/auth_helper.js"></script>
    <script>
        function switchPage(url) {
            var sep = url.indexOf('?') >= 0 ? '&' : '?';
            document.getElementById('page-frame').src = url + sep + 'embed=1';
            document.querySelectorAll('#navTabs .nav-link').forEach(function(link) {
                link.classList.toggle('active', link.dataset.page === url);
            });
            setTimeout(updateNavSlider, 100);
            return false;
        }
        function updateNavSlider() {
            var nav = document.getElementById('navTabs');
            var slider = nav && nav.querySelector('.nav-slider');
            if (!slider) return;
            var active = nav.querySelector('.nav-link.active');
            if (active) {
                var cr = nav.getBoundingClientRect();
                var ar = active.getBoundingClientRect();
                slider.style.left = (ar.left - cr.left) + 'px';
                slider.style.width = ar.width + 'px';
            }
        }
        // 监听 iframe 加载，进入化合物页后永久显示标签
        document.getElementById('page-frame').addEventListener('load', function() {
            var frame = document.getElementById('page-frame');
            var compoundTab = document.querySelector('[data-page="/compound"]');
            try {
                var frameUrl = frame.contentWindow.location.pathname;
                if (frameUrl.indexOf('/compound/') === 0) {
                    compoundTab.style.display = '';
                    compoundTab.dataset.url = frameUrl;
                }
                // 更新 active：匹配当前 iframe URL
                var isCompound = frameUrl.indexOf('/compound/') === 0;
                document.querySelectorAll('#navTabs .nav-link').forEach(function(l) {
                    l.classList.remove('active');
                    if (l.dataset.page === '/compound' && isCompound) l.classList.add('active');
                    else if (l.dataset.page === frameUrl) l.classList.add('active');
                });
            } catch(e) {}
            updateNavSlider();
        });
        document.addEventListener('DOMContentLoaded', updateNavSlider);
        window.addEventListener('resize', updateNavSlider);
    </script>
</body>
</html>
