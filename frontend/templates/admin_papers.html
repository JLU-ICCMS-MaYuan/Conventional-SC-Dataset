<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全局文献管理 - 超导文献数据库</title>
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .filter-section {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .batch-actions {
            position: sticky;
            top: 10px;
            z-index: 100;
            background-color: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: block;
        }
        .paper-checkbox {
            cursor: pointer;
            width: 20px;
            height: 20px;
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <div class="container-fluid mt-4">
        <h2 data-i18n="admin.manage_all_papers">全局文献管理</h2>
        <p class="text-muted" data-i18n="admin.paper_statistics">查看和管理所有文献，支持多维度筛选和操作</p>

        <!-- 筛选区域 -->
        <div class="filter-section">
            <h5>筛选条件</h5>
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label">审核状态</label>
                    <select class="form-select" id="filterReviewStatus">
                        <option value="">全部</option>
                        <option value="pending">未审核</option>
                        <option value="approved">✅ 已通过</option>
                        <option value="rejected">❌ 已拒绝</option>
                        <option value="needs_revision">需修改</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">文章类型</label>
                    <select class="form-select" id="filterArticleType">
                        <option value="">全部</option>
                        <option value="theoretical">理论</option>
                        <option value="experimental">实验</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">超导体类型</label>
                    <select class="form-select" id="filterSuperconductorType">
                        <option value="">全部</option>
                        <option value="cuprate">铜基</option>
                        <option value="iron_based">铁基</option>
                        <option value="nickel_based">镍基</option>
                        <option value="hydride">高压氢化物</option>
                        <option value="carbon">碳基</option>
                        <option value="organic">有机</option>
                        <option value="others">其他超导</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">是否显示在图表</label>
                    <select class="form-select" id="filterShowInChart">
                        <option value="">全部</option>
                        <option value="true">显示</option>
                        <option value="false">隐藏</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">年份范围</label>
                    <div class="input-group">
                        <input type="number" class="form-control" id="filterYearMin" placeholder="最小">
                        <span class="input-group-text">-</span>
                        <input type="number" class="form-control" id="filterYearMax" placeholder="最大">
                    </div>
                </div>
                <div class="col-md-9">
                    <label class="form-label">关键词搜索</label>
                    <input type="text" class="form-control" id="filterKeyword" placeholder="搜索标题、DOI、化学式...">
                </div>
                <div class="col-md-3">
                    <label class="form-label" data-i18n="compound.database">数据库</label>
                    <select class="form-select" id="filterDatabase" onchange="loadPapers()">
                        <option value="local" data-i18n="compound.local_db">本地数据库</option>
                        <option value="ai" data-i18n="compound.ai_db">AI筛选</option>
                    </select>
                </div>
                <div class="col-md-3 d-flex align-items-end">
                    <button class="btn btn-primary w-100" onclick="loadPapers()">应用筛选</button>
                </div>
            </div>
        </div>

        <!-- 操作栏 -->
        <div class="batch-actions" id="batchActions">
            <div class="d-flex align-items-center justify-content-between">
                <div>
                    <input type="checkbox" id="selectAll" class="paper-checkbox me-2" onchange="toggleSelectAll()">
                    <label for="selectAll">已选中 <strong id="selectedCount">0</strong> 篇文献</label>
                </div>
                <div class="btn-group">
                    <select class="form-select form-select-sm me-2" id="batchStatusSelect" style="width: auto;">
                        <option value="approved">✅ 通过</option>
                        <option value="rejected">❌ 拒绝</option>
                        <option value="needs_revision">需修改</option>
                        <option value="pending">撤回审核</option>
                        <option value="chart_show" data-superadmin-only="true">📈 显示在图表</option>
                        <option value="chart_hide" data-superadmin-only="true">📉 从图表隐藏</option>
                        <option value="delete" data-superadmin-only="true">🗑️ 删除</option>
                    </select>
                    <button class="btn btn-success btn-sm" onclick="batchReview()">应用操作</button>
                    <button class="btn btn-secondary btn-sm" onclick="clearSelection()">取消选择</button>
                </div>
            </div>
        </div>

        <!-- 文献列表 -->
        <div id="papersList">
            <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">加载中...</span>
                </div>
                <p class="mt-3">正在加载...</p>
            </div>
        </div>

        <!-- 分页 -->
        <nav id="pagination" class="mt-4" style="display:none;">
            <ul class="pagination justify-content-center">
                <!-- 动态生成分页按钮 -->
            </ul>
        </nav>
    </div>

    <!-- 编辑文献模态框（复用admin_dashboard的模态框，添加图片管理） -->
    <div class="modal fade" id="editPaperModal" tabindex="-1">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">编辑文献信息</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <ul class="nav nav-tabs" role="tablist">
                        <li class="nav-item">
                            <a class="nav-link active" data-bs-toggle="tab" href="#basicInfo">信息</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" data-bs-toggle="tab" href="#detailInfo">详细信息</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" data-bs-toggle="tab" href="#reviewSection">文献审核</a>
                        </li>
                    </ul>

                    <div class="tab-content mt-3">
                        <!-- 信息标签页（可编辑基础字段） -->
                        <div class="tab-pane fade show active" id="basicInfo">
                            <form id="editPaperForm">
                                <input type="hidden" id="editPaperId">
                                <div class="mb-3">
                                    <label class="form-label">DOI</label>
                                    <input type="text" class="form-control" id="editDoi">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">标题</label>
                                    <input type="text" class="form-control" id="editTitle">
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">期刊</label>
                                        <input type="text" class="form-control" id="editJournal">
                                    </div>
                                    <div class="col-md-2 mb-3">
                                        <label class="form-label">年份</label>
                                        <input type="number" class="form-control" id="editYear">
                                    </div>
                                    <div class="col-md-2 mb-3">
                                        <label class="form-label">卷号</label>
                                        <input type="text" class="form-control" id="editVolume">
                                    </div>
                                    <div class="col-md-2 mb-3">
                                        <label class="form-label">页码</label>
                                        <input type="text" class="form-control" id="editPages">
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">作者（逗号分隔）</label>
                                    <textarea class="form-control" id="editAuthors" rows="2"></textarea>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">摘要</label>
                                    <textarea class="form-control" id="editAbstract" rows="3"></textarea>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">文章类型</label>
                                        <select class="form-select" id="editArticleType">
                                            <option value="e">实验</option>
                                            <option value="t">理论</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">超导体类型</label>
                                        <select class="form-select" id="editSuperconductorType">
                                            <option value="h">高压氢化物</option>
                                            <option value="c">碳基</option>
                                            <option value="cb">铜基</option>
                                            <option value="ot">其他超导</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">化合物与物理数据</label>
                                    <div id="editDataPointsContainer"></div>
                                    <button type="button" class="btn btn-outline-primary btn-sm mt-1" onclick="addEditDataRow()">+ 添加一组数据</button>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">备注</label>
                                    <textarea class="form-control" id="editNotes" rows="2"></textarea>
                                </div>
                                <div class="row mb-3 text-muted small">
                                    <div class="col-md-4">记录数：<span id="detailRecordCount">-</span></div>
                                    <div class="col-md-4">贡献者：<span id="detailUploader">-</span></div>
                                    <div class="col-md-4">创建时间：<span id="detailCreatedAt">-</span></div>
                                </div>
                                <div class="form-check mb-3">
                                    <input type="checkbox" class="form-check-input" id="editShowInChart">
                                    <label class="form-check-label" for="editShowInChart">显示在图表中</label>
                                </div>
                                <button type="button" class="btn btn-primary" onclick="savePaperEdits()">💾 保存修改</button>
                            </form>
                        </div>

                        <!-- 详细信息标签页（records 全字段表格） -->
                        <div class="tab-pane fade" id="detailInfo">
                            <div id="recordsDetailTable" class="table-responsive" style="max-height:500px;overflow-y:auto;">
                                <table class="table table-sm table-bordered small mb-0">
                                    <thead class="table-light"><tr><th>#</th>
                                        <th>化学式</th><th>来源</th><th>P(GPa)</th><th>空间群</th><th>晶体结构</th>
                                        <th>McMillan</th><th>Allen-Dynes</th><th>Eliash(iso)</th><th>Eliash(aniso)</th><th>实验Tc</th>
                                        <th>λ</th><th>ω_log</th><th>N(Ef)</th><th>Ef(eV)</th>
                                        <th>稳定</th><th>动稳</th><th>E_hull</th><th>图表</th><th>类型</th><th>超导类型</th>
                                        <th>S</th><th>方法</th><th>备注</th>
                                    </tr></thead>
                                    <tbody id="recordsTableBody"></tbody>
                                </table>
                            </div>
                        </div>

                        <!-- 文献审核标签页 -->
                        <div class="tab-pane fade" id="reviewSection">
                            <div class="card bg-light">
                                <div class="card-body">
                                    <h5 class="card-title">审核决策</h5>
                                    <div class="mb-3">
                                        <label class="form-label">当前状态</label>
                                        <div id="currentReviewStatusDisplay"></div>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">变更状态为</label>
                                        <select class="form-select" id="editReviewStatus">
                                            <option value="pending">未审核</option>
                                            <option value="approved">✅ 已通过</option>
                                            <option value="rejected">❌ 已拒绝</option>
                                            <option value="needs_revision">需修改</option>
                                        </select>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">审核意见 / 理由</label>
                                        <textarea class="form-control" id="editReviewComment" rows="3" placeholder="例如：数据有误，请修改；或 DOI 填写不规范等"></textarea>
                                    </div>
                                    <button type="button" class="btn btn-primary" onclick="submitReviewAction()">提交审核结果</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="savePaperEdits()">保存修改</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/i18n.js"></script>
    <script src="/static/js/auth_state.js"></script>
    <script src="/static/js/admin_papers.js?v=20260617"></script>
</body>
</html>
