<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="register.admin_title">管理员注册 - 超导文献数据库</title>
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body p-5">
                        <h2 class="text-center mb-4" data-i18n="register.admin_title">📝 申请成为管理员</h2>

                        <!-- 第一步：填写信息并发送验证码 -->
                        <div id="step1">
                            <form id="registerForm">
                                <div class="mb-3">
                                    <label for="email" class="form-label" data-i18n="register.email">邮箱 *</label>
                                    <input type="email" class="form-control" id="email" required>
                                    <small class="text-muted" data-i18n="register.email_hint">将用于接收验证码和登录</small>
                                </div>

                                <div class="mb-3">
                                    <label for="realName" class="form-label" data-i18n="register.real_name">真实姓名 *</label>
                                    <input type="text" class="form-control" id="realName" required>
                                    <small class="text-muted" data-i18n="register.real_name_hint">审核文献时将显示此姓名</small>
                                </div>

                                <div class="mb-3">
                                    <label for="password" class="form-label" data-i18n="register.password">密码 *</label>
                                    <input type="password" class="form-control" id="password" required minlength="6">
                                    <small class="text-muted" data-i18n="register.password_hint">至少6位字符</small>
                                </div>

                                <div class="mb-3">
                                    <label for="passwordConfirm" class="form-label" data-i18n="register.password_confirm">确认密码 *</label>
                                    <input type="password" class="form-control" id="passwordConfirm" required>
                                </div>

                                <div class="d-grid gap-2 mb-3">
                                    <button type="submit" class="btn btn-primary btn-lg" data-i18n="register.send_code">发送验证码</button>
                                </div>
                            </form>
                        </div>

                        <!-- 第二步：输入验证码 -->
                        <div id="step2" style="display: none;">
                            <div class="alert alert-info" data-i18n="register.code_sent">
                                验证码已发送到您的邮箱，请在 5 分钟内完成验证
                            </div>

                            <form id="verifyForm">
                                <div class="mb-3">
                                    <label for="code" class="form-label" data-i18n="register.code_label">验证码 *</label>
                                    <input type="text" class="form-control" id="code" required maxlength="6" data-i18n-placeholder="register.code_placeholder" placeholder="6位数字">
                                </div>

                                <div class="d-grid gap-2 mb-3">
                                    <button type="submit" class="btn btn-success btn-lg" data-i18n="register.verify_email">验证邮箱</button>
                                </div>

                                <div class="text-center">
                                    <button type="button" class="btn btn-link" onclick="location.reload()" data-i18n="register.go_back">返回重新填写</button>
                                </div>
                            </form>
                        </div>

                        <!-- 第三步：等待审批 -->
                        <div id="step3" style="display: none;">
                            <div class="alert alert-success text-center">
                                <h4 data-i18n="register.verify_success_title">✅ 邮箱验证成功！</h4>
                                <p class="mb-0" data-i18n="register.verify_success_msg">您的管理员申请已提交，请等待超级管理员审批。</p>
                                <p class="mt-2 mb-0" data-i18n="register.verify_success_notify">审批通过后，您将收到邮件通知。</p>
                            </div>

                            <div class="text-center mt-4">
                                <a href="/admin/login" class="btn btn-primary" data-i18n="register.go_to_login">前往登录页面</a>
                            </div>
                        </div>

                        <hr>

                        <div class="text-center">
                            <a href="/admin/login" class="text-decoration-none" data-i18n="register.has_account">已有账号？立即登录</a>
                            <br>
                            <a href="/" class="btn btn-link mt-2" data-i18n="common.back_home">返回首页</a>
                        </div>
                        <div class="text-center mt-2">
                            <button class="btn btn-outline-secondary btn-sm" onclick="I18N.toggle()" data-i18n="common.language">中/EN</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/i18n.js"></script>
    <script>
        let registeredEmail = '';

        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('passwordConfirm').value;
            const realName = document.getElementById('realName').value;

            if (password !== passwordConfirm) {
                alert(I18N.t('register.password_mismatch'));
                return;
            }

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, real_name: realName, is_admin: true })
                });

                const data = await response.json();

                if (response.ok) {
                    registeredEmail = email;
                    document.getElementById('step1').style.display = 'none';
                    document.getElementById('step2').style.display = 'block';
                } else {
                    alert('Registration failed: ' + (data.detail || 'Unknown error'));
                }
            } catch (error) {
                console.error('Register error:', error);
                alert('Registration failed. Please check your network.');
            }
        });

        document.getElementById('verifyForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const code = document.getElementById('code').value;

            try {
                const response = await fetch('/api/auth/verify-email', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: registeredEmail, code: code })
                });

                const data = await response.json();

                if (response.ok) {
                    document.getElementById('step2').style.display = 'none';
                    document.getElementById('step3').style.display = 'block';
                } else {
                    alert('Verification failed: ' + (data.detail || 'Unknown error'));
                }
            } catch (error) {
                console.error('Verify error:', error);
                alert('Verification failed. Please check your network.');
            }
        });
    </script>
</body>
</html>
