<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="login.title">登录 - 超导文献数据库</title>
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body {
            background: linear-gradient(135deg, #1d3557, #457b9d);
            min-height: 100vh;
        }
    </style>
</head>
<body class="d-flex align-items-center py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-lg border-0">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <h2 class="fw-bold" id="loginTitle" data-i18n="login.welcome">欢迎登录</h2>
                            <p class="text-muted mb-0" id="loginSubtitle" data-i18n="login.subtitle">使用同一账号即可访问用户和管理员功能</p>
                        </div>

                        <div class="alert alert-info d-none" id="sessionAlert"></div>
                        <div class="alert alert-danger d-none" id="errorAlert"></div>

                        <form id="loginForm" class="mt-3">
                            <div class="mb-3">
                                <label for="email" class="form-label" data-i18n="login.email">邮箱</label>
                                <input type="email" class="form-control" id="email" required data-i18n-placeholder="login.email_placeholder" placeholder="you@example.com">
                            </div>
                            <div class="mb-4">
                                <label for="password" class="form-label" data-i18n="login.password">密码</label>
                                <input type="password" class="form-control" id="password" required data-i18n-placeholder="login.password_placeholder" placeholder="请输入密码">
                            </div>
                            <button type="submit" class="btn btn-primary btn-lg w-100" id="loginButton" data-i18n="login.submit">立即登录</button>
                        </form>

                        <div class="text-center mt-4" id="registerLinks"></div>
                        <hr>
                        <div class="text-center">
                            <a href="/" class="btn btn-link" data-i18n="common.back_home">返回首页</a>
                        </div>
                        <div class="text-center mt-2">
                            <button class="btn btn-outline-secondary btn-sm" onclick="I18N.toggle()" data-i18n="common.language">中/EN</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/i18n.js"></script>
    <script src="/static/js/auth_state.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const isAdminMode = window.location.pathname.startsWith('/admin');
            const titleEl = document.getElementById('loginTitle');
            const subtitleEl = document.getElementById('loginSubtitle');
            const registerLinksEl = document.getElementById('registerLinks');
            const sessionAlert = document.getElementById('sessionAlert');
            const errorAlert = document.getElementById('errorAlert');

            function updateTexts() {
                titleEl.textContent = isAdminMode ? I18N.t('login.admin_title') : I18N.t('login.user_title');
                subtitleEl.textContent = isAdminMode ? I18N.t('login.admin_subtitle') : I18N.t('login.user_subtitle');
                registerLinksEl.innerHTML = isAdminMode
                    ? I18N.t('login.no_admin_account') + '<a href="/admin/register" class="text-decoration-none">' + I18N.t('login.submit_application') + '</a>'
                    : I18N.t('login.no_account') + '<a href="/register" class="text-decoration-none">' + I18N.t('login.register_now') + '</a>';
            }
            updateTexts();
            document.addEventListener('langChange', updateTexts);

            const existingState = window.authState ? window.authState.get() : null;
            if (existingState && existingState.user) {
                const { user } = existingState;
                const target = user.is_admin ? (user.is_superadmin ? '/admin/superadmin' : '/admin/dashboard') : '/';
                sessionAlert.classList.remove('d-none');
                sessionAlert.innerHTML = I18N.t('login.session_exists', { name: user.real_name, url: target });
            }

            document.getElementById('loginForm').addEventListener('submit', async (event) => {
                event.preventDefault();
                errorAlert.classList.add('d-none');

                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                const submitBtn = document.getElementById('loginButton');
                submitBtn.disabled = true;
                submitBtn.textContent = I18N.t('login.logging_in');

                try {
                    const response = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.detail || 'Login failed');
                    }

                    if (window.authState) {
                        window.authState.save(data.access_token, data.user);
                    }

                    if (isAdminMode && !data.user.is_admin) {
                        alert('This account does not have admin permissions. Redirecting to user home.');
                    }

                    window.location.href = '/';
                } catch (error) {
                    console.error('Login failed:', error);
                    errorAlert.textContent = error.message;
                    errorAlert.classList.remove('d-none');
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = I18N.t('login.submit');
                }
            });
        });
    </script>
</body>
</html>
