<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员面板 - 超导文献数据库</title>
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
            },
            startup: {
                typeset: false
            }
        };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">超导文献数据库</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="/admin/dashboard">审核文献</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/papers">全局管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/superadmin">超级管理员</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center text-white">
                    <span class="me-3">欢迎，<span id="userName"></span></span>
                    <button class="btn btn-outline-light btn-sm" onclick="logout()">退出</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2>待审核文献列表</h2>

        <div id="unreviewedPapers" class="mt-4">
            <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">加载中...</span>
                </div>
                <p class="mt-3">正在加载...</p>
            </div>
        </div>

        <div id="dashboardPaginationSummary" class="mt-3 text-muted small"></div>
        <nav id="dashboardPagination" class="mt-3" style="display:none;">
            <ul class="pagination justify-content-center mb-0"></ul>
        </nav>
    </div>

    <!-- 编辑文献模态框 -->
    <div class="modal fade" id="editPaperModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">编辑文献信息</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="editPaperForm">
                        <input type="hidden" id="editPaperId">

                        <div class="mb-3">
                            <label class="form-label">DOI <small class="text-muted">(只读)</small></label>
                            <input type="text" class="form-control" id="editDoi" readonly>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">标题 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="editTitle" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">期刊</label>
                                <input type="text" class="form-control" id="editJournal">
                            </div>
                            <div class="col-md-3 mb-3">
                                <label class="form-label">年份</label>
                                <input type="number" class="form-control" id="editYear" min="1900" max="2100">
                            </div>
                            <div class="col-md-3 mb-3">
                                <label class="form-label">卷号</label>
                                <input type="text" class="form-control" id="editVolume">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">作者</label>
                            <textarea class="form-control" id="editAuthors" rows="2"></textarea>
                            <small class="text-muted">JSON格式，如：["张三", "李四"]</small>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">文章类型</label>
                                <select class="form-select" id="editArticleType">
                                    <option value="theoretical">理论</option>
                                    <option value="experimental">实验</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">超导体类型</label>
                                <select class="form-select" id="editSuperconductorType">
                                    <option value="cuprate">铜基</option>
                                    <option value="iron_based">铁基</option>
                                    <option value="nickel_based">镍基</option>
                                    <option value="hydride">高压氢化物</option>
                                    <option value="carbon">碳基</option>
                                    <option value="organic">有机</option>
                                    <option value="others">其他超导</option>
                                </select>
                            </div>
                        </div>

                        <!-- 审核状态编辑 (由于是审核页面，可能需要在这里也能改状态) -->
                        <div class="mb-3">
                            <label class="form-label">审核状态</label>
                            <select class="form-select" id="editReviewStatus">
                                <option value="unreviewed">⏳ 未审核</option>
                                <option value="approved">✅ 已通过</option>
                                <option value="rejected">❌ 已拒绝</option>
                                <option value="modifying">🛠️ 待修改</option>
                                <option value="admin_only">🔒 仅管理员可见</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">化合物与物理数据 <span class="text-danger">*</span></label>
                            <div id="editDataPointsContainer">
                                <!-- 动态数据行 -->
                            </div>
                            <button type="button" class="btn btn-outline-primary btn-sm mt-1" onclick="addEditDataRow()">+ 添加一组数据</button>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">图片分组与介绍</label>
                            <div id="editImageGroups" class="border rounded p-3 bg-light-subtle">
                                <div class="text-muted small">打开文献后加载图片分组...</div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">贡献者</label>
                                <input type="text" class="form-control" id="editContributorName">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">贡献者单位</label>
                                <input type="text" class="form-control" id="editContributorAffiliation">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">备注</label>
                            <textarea class="form-control" id="editNotes" rows="3"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="savePaperEdits()">保存修改</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/auth_state.js"></script>
    <script>
        let token = '';
        let currentUser = null;
        let editModal = null;
        const dashboardPagination = {
            page: 1,
            pageSize: 50,
            total: 0,
            totalPages: 0,
        };
        const SUPER_TYPES = ['cuprate', 'iron_based', 'nickel_based', 'hydride', 'carbon', 'organic', 'others'];
        const LEGACY_SUPER_TYPES = {
            'carbon_organic': 'carbon',
            'conventional': 'others',
            'other_conventional': 'others',
            'unconventional': 'others',
            'other_unconventional': 'others',
            'unknown': 'others'
        };

        function normalizeSuperconductorType(value) {
            if (!value) return 'others';
            const normalized = LEGACY_SUPER_TYPES[value] || value;
            return SUPER_TYPES.includes(normalized) ? normalized : 'others';
        }

        function escapeHtml(value) {
            const div = document.createElement('div');
            div.textContent = value ?? '';
            return div.innerHTML;
        }

        function normalizeArticleType(value) {
            if (value === 'e') return 'experimental';
            if (value === 't') return 'theoretical';
            return value || '';
        }

        function synthesizedLabel(value) {
            const normalized = normalizeArticleType(value);
            if (normalized === 'experimental') return '是';
            if (normalized === 'theoretical') return '否';
            return '-';
        }

        function formatDataValue(value, suffix = '') {
            return value !== null && value !== undefined && value !== '' ? `${escapeHtml(value)}${suffix}` : '-';
        }

        function formatRangeValue(value, suffix = '') {
            if (Array.isArray(value)) {
                if (value.length === 0) return '-';
                if (value.length === 1) return `${escapeHtml(value[0])}${suffix}`;
                return `${escapeHtml(value[0])}–${escapeHtml(value[value.length - 1])}${suffix}`;
            }
            return formatDataValue(value, suffix);
        }

        function hasMeaningfulText(value) {
            return typeof value === 'string' && value.trim() !== '';
        }

        function buildMathContentHtml(value) {
            return escapeHtml(value || '').replace(/\r?\n/g, '<br>');
        }

        async function typesetMath(container) {
            if (!container || !window.MathJax?.typesetPromise) {
                return;
            }
            try {
                await window.MathJax.typesetPromise([container]);
            } catch (error) {
                console.error('公式渲染失败:', error);
            }
        }

        function renderImageGroupIntro(intro) {
            if (!intro) return '';

            const englishText = hasMeaningfulText(intro.text) ? intro.text.trim() : '';
            const chineseText = hasMeaningfulText(intro.text_cn) ? intro.text_cn.trim() : '';

            if (!englishText && !chineseText) {
                return '';
            }

            return `
                <div class="mt-3 border-top pt-3">
                    ${englishText ? `
                        <div class="mb-2">
                            <div class="small text-muted math-content">${buildMathContentHtml(englishText)}</div>
                        </div>
                    ` : ''}
                    ${chineseText ? `
                        <div>
                            <div class="small text-muted math-content">${buildMathContentHtml(chineseText)}</div>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function renderDashboardImageGroups(payload) {
            const container = document.getElementById('editImageGroups');
            if (!container) return;

            const groups = Array.isArray(payload?.review_groups) ? payload.review_groups : [];
            const warnings = Array.isArray(payload?.grouping_meta?.warnings) ? payload.grouping_meta.warnings : [];

            if (groups.length === 0) {
                container.innerHTML = '<div class="text-muted small">暂无图片分组数据</div>';
                return;
            }

            const warningHtml = warnings.length > 0
                ? `<div class="alert alert-warning py-2 small mb-3">${warnings.map(item => escapeHtml(item)).join('<br>')}</div>`
                : '';

            container.innerHTML = warningHtml + groups.map(group => {
                const images = Array.isArray(group.images) ? group.images : [];
                const imagesHtml = images.length > 0
                    ? `<div class="d-flex flex-wrap gap-2">${images.map(img => `
                        <a href="/api/papers/images/${img.id}" target="_blank" class="text-decoration-none">
                            <img src="/api/papers/images/${img.id}?thumbnail=true"
                                 alt="图片 ${img.order}"
                                 class="img-thumbnail"
                                 style="width: 140px; height: 140px; object-fit: cover;">
                            <div class="small text-center text-muted mt-1">图片 ${img.order}</div>
                        </a>
                    `).join('')}</div>`
                    : '<div class="text-muted small">该组暂无图片</div>';

                return `
                    <div class="card mb-3">
                        <div class="card-body">
                            <div class="fw-semibold mb-2">第 ${group.group_index} 组</div>
                            ${imagesHtml}
                            ${renderImageGroupIntro(group.intro)}
                        </div>
                    </div>
                `;
            }).join('');

            typesetMath(container);
        }

        async function loadDashboardImageGroups(paperId) {
            const container = document.getElementById('editImageGroups');
            if (container) {
                container.innerHTML = '<div class="text-muted small">正在加载图片分组...</div>';
            }

            const response = await fetch(`/api/admin/papers/${paperId}/images`, {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });
            const data = await response.json();
            if (!response.ok) {
                throw new Error(data.detail || '加载图片分组失败');
            }
            renderDashboardImageGroups(data);
        }

        function clearDashboardPagination() {
            const summaryEl = document.getElementById('dashboardPaginationSummary');
            const paginationEl = document.getElementById('dashboardPagination');
            if (summaryEl) summaryEl.textContent = '';
            if (paginationEl) {
                paginationEl.style.display = 'none';
                const list = paginationEl.querySelector('ul');
                if (list) list.innerHTML = '';
            }
        }

        function createPaginationItem(label, page, disabled = false, active = false) {
            return `
                <li class="page-item ${disabled ? 'disabled' : ''} ${active ? 'active' : ''}">
                    <button class="page-link" type="button" ${disabled ? 'disabled' : ''} onclick="changeDashboardPage(${page})">${label}</button>
                </li>
            `;
        }

        function renderDashboardPagination(total) {
            const summaryEl = document.getElementById('dashboardPaginationSummary');
            const paginationEl = document.getElementById('dashboardPagination');
            const listEl = paginationEl?.querySelector('ul');
            if (!summaryEl || !paginationEl || !listEl) return;

            dashboardPagination.total = total;
            dashboardPagination.totalPages = total > 0 ? Math.ceil(total / dashboardPagination.pageSize) : 0;

            if (total === 0 || dashboardPagination.totalPages <= 1) {
                const start = total === 0 ? 0 : (dashboardPagination.page - 1) * dashboardPagination.pageSize + 1;
                const end = Math.min(dashboardPagination.page * dashboardPagination.pageSize, total);
                summaryEl.textContent = total === 0 ? '' : `第 ${start}–${end} 条，共 ${total} 条`;
                paginationEl.style.display = 'none';
                listEl.innerHTML = '';
                return;
            }

            const start = (dashboardPagination.page - 1) * dashboardPagination.pageSize + 1;
            const end = Math.min(dashboardPagination.page * dashboardPagination.pageSize, total);
            summaryEl.textContent = `第 ${start}–${end} 条，共 ${total} 条`;

            const pages = [];
            pages.push(createPaginationItem('上一页', dashboardPagination.page - 1, dashboardPagination.page === 1));

            const startPage = Math.max(1, dashboardPagination.page - 2);
            const endPage = Math.min(dashboardPagination.totalPages, dashboardPagination.page + 2);

            for (let page = startPage; page <= endPage; page += 1) {
                pages.push(createPaginationItem(String(page), page, false, page === dashboardPagination.page));
            }

            pages.push(createPaginationItem('下一页', dashboardPagination.page + 1, dashboardPagination.page === dashboardPagination.totalPages));
            listEl.innerHTML = pages.join('');
            paginationEl.style.display = 'block';
        }

        function changeDashboardPage(page) {
            if (page < 1 || page > dashboardPagination.totalPages || page === dashboardPagination.page) {
                return;
            }
            dashboardPagination.page = page;
            loadUnreviewedPapers();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderPhysicalDataTable(paper) {
            const rows = Array.isArray(paper.data) && paper.data.length > 0 ? paper.data : [paper];
            return `
                <div class="table-responsive mt-2">
                    <table class="table table-sm table-bordered align-middle mb-2">
                        <thead class="table-light">
                            <tr>
                                <th>化学式</th>
                                <th>空间群</th>
                                <th>是否实验合成</th>
                                <th>Tc</th>
                                <th>P</th>
                                <th>λ</th>
                                <th>ω_log</th>
                                <th>N(EF)</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${rows.map(item => `
                                <tr>
                                    <td>${formatDataValue(item.chemical_formula || paper.chemical_formula)}</td>
                                    <td>${formatDataValue(item.crystal_structure || paper.crystal_structure)}</td>
                                    <td>${synthesizedLabel(item.article_type || paper.article_type)}</td>
                                    <td>${formatRangeValue(item.tc, ' K')}</td>
                                    <td>${formatRangeValue(item.tc_press ?? item.pressure, ' GPa')}</td>
                                    <td>${formatDataValue(item.lambda_val)}</td>
                                    <td>${formatDataValue(item.omega_log)}</td>
                                    <td>${formatDataValue(item.n_ef)}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function nullableFloat(value) {
            return value === '' || value === null || value === undefined ? null : parseFloat(value);
        }

        function dataInputValue(data, field) {
            return data && data[field] !== null && data[field] !== undefined ? escapeHtml(data[field]) : '';
        }

        // 检查登录状态
        function checkAuth() {
            if (!window.authState) {
                alert('登录状态异常，请刷新重试');
                return false;
            }

            const state = window.authState.get();
            if (!state || !state.token || !state.user) {
                alert('请先登录');
                window.location.href = '/admin/login';
                return false;
            }

            if (!state.user.is_admin) {
                alert('当前账号没有管理员权限');
                window.location.href = '/';
                return false;
            }

            token = state.token;
            currentUser = state.user;
            document.getElementById('userName').textContent = currentUser.real_name;
            return true;
        }

        // 退出登录
        function logout() {
            if (window.authState) {
                window.authState.clear();
            }
            window.location.href = '/admin/login';
        }

        // 加载未审核文献
        async function loadUnreviewedPapers() {
            const offset = (dashboardPagination.page - 1) * dashboardPagination.pageSize;
            try {
                const response = await fetch(`/api/admin/papers/unreviewed?limit=${dashboardPagination.pageSize}&offset=${offset}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.detail || '加载失败');
                }

                renderPapers(Array.isArray(data.papers) ? data.papers : [], data.total || 0);
            } catch (error) {
                console.error('加载文献失败:', error);
                clearDashboardPagination();
                document.getElementById('unreviewedPapers').innerHTML = `
                    <div class="alert alert-danger">加载失败: ${error.message}</div>
                `;
            }
        }

        // 渲染文献列表
        function renderPapers(papers, total) {
            const container = document.getElementById('unreviewedPapers');

            if (papers.length === 0) {
                container.innerHTML = `
                    <div class="alert alert-success text-center">
                        <h4>🎉 太棒了！</h4>
                        <p class="mb-0">目前没有待审核的文献</p>
                    </div>
                `;
                clearDashboardPagination();
                return;
            }

            let html = `<p class="text-muted">共 ${total} 篇待审核文献</p>`;

            papers.forEach(paper => {
                const safeTitle = escapeHtml(paper.title);
                const safeJournal = escapeHtml(paper.journal || '未知');
                const safeContributor = escapeHtml(paper.contributor_name);

                let buttons = `
                    <a href="https://doi.org/${paper.doi}" target="_blank" class="btn btn-sm btn-outline-primary">查看原文</a>
                    <button class="btn btn-sm btn-warning btn-edit" data-paper-id="${paper.id}">详情/编辑</button>
                    <button class="btn btn-sm btn-success btn-approve" data-paper-id="${paper.id}" data-paper-title="${safeTitle}">通过</button>
                    <button class="btn btn-sm btn-danger btn-reject" data-paper-id="${paper.id}" data-paper-title="${safeTitle}">拒绝</button>
                `;

                if (currentUser && currentUser.is_superadmin) {
                    buttons += `<button class="btn btn-sm btn-danger btn-delete" data-paper-id="${paper.id}" data-paper-doi="${paper.doi}" data-paper-title="${safeTitle}">删除</button>`;
                }

                html += `
                    <div class="card mb-3">
                        <div class="card-body">
                            <h5 class="card-title">${safeTitle}</h5>
                            <p class="text-muted mb-2">
                                <strong>DOI:</strong> ${paper.doi}<br>
                                <strong>期刊:</strong> ${safeJournal} (${paper.year || '未知年份'})<br>
                                <strong>贡献者:</strong> ${safeContributor}<br>
                                <strong>提交时间:</strong> ${new Date(paper.created_at).toLocaleString('zh-CN')}
                            </p>
                            ${renderPhysicalDataTable(paper)}
                            <div class="d-flex gap-2 flex-wrap">
                                ${buttons}
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            renderDashboardPagination(total);

            container.querySelectorAll('.btn-approve').forEach(btn => {
                btn.addEventListener('click', function() {
                    const paperId = this.getAttribute('data-paper-id');
                    const paperTitle = this.getAttribute('data-paper-title');
                    reviewPaper(paperId, paperTitle, 'approved');
                });
            });

            container.querySelectorAll('.btn-reject').forEach(btn => {
                btn.addEventListener('click', function() {
                    const paperId = this.getAttribute('data-paper-id');
                    const paperTitle = this.getAttribute('data-paper-title');
                    reviewPaper(paperId, paperTitle, 'rejected');
                });
            });

            container.querySelectorAll('.btn-edit').forEach(btn => {
                btn.addEventListener('click', function() {
                    const paperId = this.getAttribute('data-paper-id');
                    openEditModal(paperId);
                });
            });

            container.querySelectorAll('.btn-delete').forEach(btn => {
                btn.addEventListener('click', function() {
                    const paperId = this.getAttribute('data-paper-id');
                    const paperDoi = this.getAttribute('data-paper-doi');
                    const paperTitle = this.getAttribute('data-paper-title');
                    deletePaper(paperId, paperDoi, paperTitle);
                });
            });
        }

        // 审核文献
        async function reviewPaper(paperId, title, status = 'approved') {
            const statusText = status === 'approved' ? '通过' : '拒绝';
            if (!confirm(`确认标记《${title}》为${statusText}？`)) {
                return;
            }

            try {
                const response = await fetch(`/api/admin/papers/${paperId}/review`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        status: status,
                        comment: ''
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    alert(`已标记为${statusText}！`);
                    loadUnreviewedPapers(); // 重新加载列表
                } else {
                    alert('操作失败: ' + (data.detail || '未知错误'));
                }
            } catch (error) {
                console.error('审核失败:', error);
                alert('操作失败，请检查网络连接');
            }
        }

        // 编辑文献助手函数
        function addEditDataRow(data = null) {
            const container = document.getElementById('editDataPointsContainer');
            const row = document.createElement('div');
            row.className = 'edit-data-row card p-2 mb-2 bg-light';
            const articleType = normalizeArticleType(data ? data.article_type : '') || document.getElementById('editArticleType').value || 'theoretical';
            row.innerHTML = `
                <div class="row g-2">
                    <div class="col-md-6 col-lg-2">
                        <input type="text" class="form-control form-control-sm edit-formula" placeholder="化学式" value="${dataInputValue(data, 'chemical_formula')}">
                    </div>
                    <div class="col-md-6 col-lg-2">
                        <input type="text" class="form-control form-control-sm edit-structure" placeholder="空间群" value="${dataInputValue(data, 'crystal_structure')}">
                    </div>
                    <div class="col-md-6 col-lg-2">
                        <select class="form-select form-select-sm edit-article-type" title="是否实验合成">
                            <option value="experimental" ${articleType === 'experimental' ? 'selected' : ''}>实验合成：是</option>
                            <option value="theoretical" ${articleType === 'theoretical' ? 'selected' : ''}>实验合成：否</option>
                        </select>
                    </div>
                    <div class="col-md-6 col-lg-1">
                        <input type="number" step="any" class="form-control form-control-sm edit-pressure" placeholder="P (GPa)" value="${dataInputValue(data, 'pressure')}">
                    </div>
                    <div class="col-md-6 col-lg-1">
                        <input type="number" step="any" class="form-control form-control-sm edit-tc" placeholder="Tc (K)" value="${dataInputValue(data, 'tc')}">
                    </div>
                    <div class="col-md-6 col-lg-1">
                        <input type="number" step="any" class="form-control form-control-sm edit-lambda" placeholder="λ" value="${dataInputValue(data, 'lambda_val')}">
                    </div>
                    <div class="col-md-6 col-lg-1">
                        <input type="number" step="any" class="form-control form-control-sm edit-omega" placeholder="ω" value="${dataInputValue(data, 'omega_log')}">
                    </div>
                    <div class="col-md-6 col-lg-1">
                        <input type="number" step="any" class="form-control form-control-sm edit-nef" placeholder="N" value="${dataInputValue(data, 'n_ef')}">
                    </div>
                    <div class="col-12 col-lg-1">
                        <button type="button" class="btn btn-outline-danger btn-sm w-100" onclick="removeEditDataRow(this)">×</button>
                    </div>
                </div>
            `;
            container.appendChild(row);
        }

        function removeEditDataRow(button) {
            const container = document.getElementById('editDataPointsContainer');
            if (container.querySelectorAll('.edit-data-row').length > 1) {
                button.closest('.edit-data-row').remove();
            } else {
                alert('至少需要保留一组数据');
            }
        }

        // 打开编辑模态框
        async function openEditModal(paperId) {
            try {
                const response = await fetch(`/api/admin/papers/${paperId}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    throw new Error('获取文献信息失败');
                }

                const paper = await response.json();

                document.getElementById('editPaperId').value = paper.id;
                document.getElementById('editDoi').value = paper.doi;
                document.getElementById('editTitle').value = paper.title || '';
                document.getElementById('editJournal').value = paper.journal || '';
                document.getElementById('editYear').value = paper.year || '';
                document.getElementById('editVolume').value = paper.volume || '';
                document.getElementById('editAuthors').value = paper.authors || '';
                document.getElementById('editArticleType').value = paper.article_type || 'experimental';
                document.getElementById('editSuperconductorType').value = normalizeSuperconductorType(paper.superconductor_type);
                document.getElementById('editReviewStatus').value = paper.review_status || 'unreviewed';

                const dataContainer = document.getElementById('editDataPointsContainer');
                dataContainer.innerHTML = '';
                if (paper.data && paper.data.length > 0) {
                    paper.data.forEach(d => addEditDataRow(d));
                } else {
                    addEditDataRow();
                }

                document.getElementById('editContributorName').value = paper.contributor_name || '';
                document.getElementById('editContributorAffiliation').value = paper.contributor_affiliation || '';
                document.getElementById('editNotes').value = paper.notes || '';

                await loadDashboardImageGroups(paperId);

                if (!editModal) {
                    editModal = new bootstrap.Modal(document.getElementById('editPaperModal'));
                }
                editModal.show();

            } catch (error) {
                console.error('打开编辑框失败:', error);
                alert('无法打开编辑框: ' + error.message);
            }
        }

        // 保存编辑
        async function savePaperEdits() {
            const paperId = document.getElementById('editPaperId').value;

            // 收集物理数据
            const physicalData = [];
            const computeSFactor = (tcValue, pressureValue) => {
                if (!Number.isFinite(tcValue) || !Number.isFinite(pressureValue)) return null;
                return tcValue / Math.sqrt(1521 + Math.pow(pressureValue, 2));
            };
            document.querySelectorAll('.edit-data-row').forEach(row => {
                const formula = row.querySelector('.edit-formula').value.trim();
                const structure = row.querySelector('.edit-structure').value.trim();
                const pressure = nullableFloat(row.querySelector('.edit-pressure').value);
                const tc = nullableFloat(row.querySelector('.edit-tc').value);
                const lambdaVal = nullableFloat(row.querySelector('.edit-lambda').value);
                const omegaLog = nullableFloat(row.querySelector('.edit-omega').value);
                const nEf = nullableFloat(row.querySelector('.edit-nef').value);
                if (formula || structure || pressure !== null || tc !== null || lambdaVal !== null || omegaLog !== null || nEf !== null) {
                    physicalData.push({
                        chemical_formula: formula || null,
                        crystal_structure: structure || null,
                        article_type: row.querySelector('.edit-article-type').value,
                        tc_press: pressure !== null ? [pressure] : null,
                        tc: tc !== null ? [tc] : null,
                        s_factor: computeSFactor(tc, pressure),
                        lambda_val: lambdaVal,
                        omega_log: omegaLog,
                        n_ef: nEf
                    });
                }
            });

            const updateData = {
                title: document.getElementById('editTitle').value,
                journal: document.getElementById('editJournal').value,
                year: document.getElementById('editYear').value ? parseInt(document.getElementById('editYear').value) : null,
                volume: document.getElementById('editVolume').value,
                authors: document.getElementById('editAuthors').value,
                article_type: document.getElementById('editArticleType').value,
                superconductor_type: document.getElementById('editSuperconductorType').value,
                review_status: document.getElementById('editReviewStatus').value,
                physical_data: physicalData,
                contributor_name: document.getElementById('editContributorName').value,
                contributor_affiliation: document.getElementById('editContributorAffiliation').value,
                notes: document.getElementById('editNotes').value
            };

            try {
                const response = await fetch(`/api/admin/papers/${paperId}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(updateData)
                });

                const data = await response.json();

                if (response.ok) {
                    alert('文献信息已更新！');
                    editModal.hide();
                    loadUnreviewedPapers(); // 重新加载列表
                } else {
                    alert('保存失败: ' + (data.detail || '未知错误'));
                }
            } catch (error) {
                console.error('保存失败:', error);
                alert('保存失败，请检查网络连接');
            }
        }

        // 删除文献（三重确认）
        async function deletePaper(paperId, paperDoi, paperTitle) {
            // 第一次确认
            if (!confirm(`⚠️ 警告：确定要删除文献《${paperTitle}》吗？\n\n此操作将删除该文献及其所有截图，且不可撤销！`)) {
                return;
            }

            // 第二次确认：输入DOI验证
            const inputDoi = prompt(`请输入该文献的DOI以确认删除：\n\n${paperDoi}`);
            if (inputDoi !== paperDoi) {
                alert('DOI不匹配，删除已取消');
                return;
            }

            // 第三次确认
            if (!confirm(`最后确认：真的要删除《${paperTitle}》吗？\n\n⚠️ 此操作不可撤销！`)) {
                return;
            }

            try {
                const response = await fetch(`/api/admin/papers/${paperId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                const data = await response.json();

                if (response.ok) {
                    alert('文献已删除！');
                    loadUnreviewedPapers(); // 重新加载列表
                } else {
                    alert('删除失败: ' + (data.detail || '未知错误'));
                }
            } catch (error) {
                console.error('删除失败:', error);
                alert('删除失败，请检查网络连接');
            }
        }

        // 页面加载时初始化
        if (checkAuth()) {
            loadUnreviewedPapers();
        }
    </script>
</body>
</html>
