<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="view-transition" content="same-origin" />
    <title data-i18n="tcpre.page_title">Tc 预测实验页</title>
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <main class="container py-4" style="animation: elementFadeIn 0.5s ease both;">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm mb-4">
                    <div class="card-body">
                        <h1 class="h3 mb-3" data-i18n="tcpre.heading">Tc 预测（测试功能）</h1>
                        <p class="text-muted" data-i18n="tcpre.description">
                            上传一份 <strong>POSCAR</strong>以及对应的
                            <strong>PDOS</strong> 数据（需包含 <code>PDOS_H.dat</code>），系统将在服务器上运行
                            轻量版的 Tc 预测脚本，并返回估算结果。
                        </p>
                        <ul class="small text-muted">
                            <li data-i18n="tcpre.note_1">目前仅支持 VASP 输出，PDOS 文件要求与原脚本一致</li>
                            <li data-i18n="tcpre.note_2">至多读取 4 个金属 PDOS 文件，多余的将被忽略</li>
                            <li data-i18n="tcpre.note_3">上传的文件只用于即时计算，不会被持久保存</li>
                        </ul>
                        <form id="tc-form" class="mt-4">
                            <div class="mb-3">
                                <label for="contcar-input" class="form-label" data-i18n="tcpre.upload_contcar">POSCAR</label>
                                <input class="form-control" type="file" id="contcar-input" accept=".*" required>
                            </div>
                            <div class="mb-3">
                                <label for="pdos-input" class="form-label" data-i18n="tcpre.upload_pdos">PDOS 文件 (含 PDOS_H)</label>
                                <input class="form-control" type="file" id="pdos-input" multiple required>
                                <div class="form-text" data-i18n="tcpre.pdos_hint">选择 2~5 个 PDOS_*.dat 文件，其中必须包含 PDOS_H.dat。</div>
                            </div>
                            <button class="btn btn-primary w-100" type="submit" id="tc-submit-btn" data-i18n="tcpre.predict">开始预测</button>
                        </form>
                        <div class="alert mt-3 d-none" id="tc-message" role="alert"></div>
                        <div class="card mt-3 d-none" id="tc-result-card">
                            <div class="card-body">
                                <h5 class="card-title" data-i18n="tcpre.result">预测结果</h5>
                                <p class="display-6" id="tc-result-value">-- K</p>
                                <dl class="row mb-0 small text-muted" id="tc-details"></dl>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="text-center text-muted small">
                    <p class="mb-0" data-i18n="tcpre.model_source">模型来源 吉林大学物理学院 姜博文</p>
                </div>
            </div>
        </div>
    </main>

    <script src="/static/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/i18n.js"></script>
    <script src="/static/js/tc_pre.js" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const nav = document.getElementById('navTabs');
            const slider = nav?.querySelector('.nav-slider');
            if (!slider) return;
            const active = nav.querySelector('.nav-link.active');
            if (active) {
                const cr = nav.getBoundingClientRect();
                const ar = active.getBoundingClientRect();
                slider.style.left = (ar.left - cr.left) + 'px';
                slider.style.width = ar.width + 'px';
            }
        });
    </script>
</body>
</html>
