<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理 - 超导文献数据库</title>
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="container-fluid mt-4">
    <h2>用户管理</h2>
    <p class="text-muted">管理所有用户、审批注册申请、分配权限</p>

    <ul class="nav nav-tabs mb-3" id="userTabs">
        <li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#allUsers">所有用户</a></li>
        <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#pendingApprovals">待审批</a></li>
        <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#allAdmins">管理员</a></li>
    </ul>

    <div class="tab-content">
        <div class="tab-pane fade show active" id="allUsers">
            <div id="allUsersList"><div class="text-center py-5"><div class="spinner-border"></div></div></div>
        </div>
        <div class="tab-pane fade" id="pendingApprovals">
            <div id="pendingList"><div class="text-center py-5"><div class="spinner-border"></div></div></div>
        </div>
        <div class="tab-pane fade" id="allAdmins">
            <div id="adminsList"><div class="text-center py-5"><div class="spinner-border"></div></div></div>
        </div>
    </div>
</div>

<script src="/static/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/auth_state.js"></script>
<script>
var token = '';
var currentUser = null;

function checkAuth() {
    var state = window.authState ? window.authState.get() : null;
    if (!state || !state.token || !state.user) {
        alert('请先登录');
        window.location.href = '/login';
        return false;
    }
    if (!state.user.is_superadmin) {
        alert('需要超级管理员权限');
        window.location.href = '/';
        return false;
    }
    token = state.token;
    currentUser = state.user;
    return true;
}

async function api(url, method, body) {
    var opts = { method: method, headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' } };
    if (body) opts.body = JSON.stringify(body);
    var resp = await fetch(url, opts);
    var data = await resp.json();
    if (!resp.ok) throw new Error(data.detail || '请求失败');
    return data;
}

function roleBadge(role) {
    var map = { superadmin: '<span class="badge bg-danger">超级管理员</span>', admin: '<span class="badge bg-primary">管理员</span>', user: '<span class="badge bg-secondary">用户</span>' };
    return map[role] || map['user'];
}

function statusBadge(user) {
    if (!user.is_approved) return '<span class="badge bg-warning">待审批</span>';
    if (!user.is_email_verified) return '<span class="badge bg-info">未验证邮箱</span>';
    return '<span class="badge bg-success">正常</span>';
}

// ====== 所有用户 ======
async function loadAllUsers() {
    var container = document.getElementById('allUsersList');
    try {
        var data = await api('/api/admin/all-users', 'GET');
        var users = Array.isArray(data) ? data : (data.users || []);
        var html = '<table class="table table-hover"><thead><tr><th>姓名</th><th>邮箱</th><th>单位</th><th>角色</th><th>状态</th><th>注册时间</th><th>操作</th></tr></thead><tbody>';
        users.forEach(function(u) {
            html += '<tr>' +
                '<td>' + (u.real_name || '-') + '</td>' +
                '<td>' + u.email + '</td>' +
                '<td>' + (u.affiliation || '-') + '</td>' +
                '<td>' + roleBadge(u.role) + '</td>' +
                '<td>' + statusBadge(u) + '</td>' +
                '<td><small>' + (u.created_at ? new Date(u.created_at).toLocaleDateString('zh-CN') : '-') + '</small></td>' +
                '<td><div class="btn-group btn-group-sm">' +
                '<button class="btn btn-outline-primary" onclick="changeRole(' + u.id + ", 'admin')\">设为管理员</button>" +
                '<button class="btn btn-outline-danger" onclick="changeRole(' + u.id + ", 'user')\">降为普通</button>" +
                '<button class="btn btn-outline-danger" onclick="deleteUser(' + u.id + ')">删除</button>' +
                '</div></td></tr>';
        });
        html += '</tbody></table>';
        container.innerHTML = html;
    } catch(e) { container.innerHTML = '<div class="alert alert-danger">加载失败: ' + e.message + '</div>'; }
}

// ====== 待审批 ======
async function loadPending() {
    var container = document.getElementById('pendingList');
    try {
        var data = await api('/api/admin/pending-approvals', 'GET');
        var users = Array.isArray(data) ? data : (data.users || []);
        if (users.length === 0) { container.innerHTML = '<div class="alert alert-success">没有待审批的用户</div>'; return; }
        var html = '<table class="table table-hover"><thead><tr><th>姓名</th><th>邮箱</th><th>单位</th><th>申请时间</th><th>操作</th></tr></thead><tbody>';
        users.forEach(function(u) {
            html += '<tr>' +
                '<td>' + (u.real_name || '-') + '</td><td>' + u.email + '</td><td>' + (u.affiliation || '-') + '</td>' +
                '<td><small>' + (u.created_at ? new Date(u.created_at).toLocaleDateString('zh-CN') : '-') + '</small></td>' +
                '<td><div class="btn-group btn-group-sm">' +
                '<button class="btn btn-success" onclick="approveUser(' + u.id + ')">通过</button>' +
                '<button class="btn btn-danger" onclick="deleteUser(' + u.id + ')">拒绝</button>' +
                '</div></td></tr>';
        });
        html += '</tbody></table>';
        container.innerHTML = html;
    } catch(e) { container.innerHTML = '<div class="alert alert-danger">加载失败: ' + e.message + '</div>'; }
}

// ====== 管理员列表 ======
async function loadAdmins() {
    var container = document.getElementById('adminsList');
    try {
        var data = await api('/api/admin/all-admins', 'GET');
        var users = Array.isArray(data) ? data : (data.users || []);
        if (users.length === 0) { container.innerHTML = '<div class="alert alert-info">暂无管理员</div>'; return; }
        var html = '<table class="table table-hover"><thead><tr><th>姓名</th><th>邮箱</th><th>单位</th><th>角色</th><th>状态</th><th>操作</th></tr></thead><tbody>';
        users.forEach(function(u) {
            html += '<tr>' +
                '<td>' + (u.real_name || '-') + '</td><td>' + u.email + '</td><td>' + (u.affiliation || '-') + '</td>' +
                '<td>' + roleBadge(u.role) + '</td><td>' + statusBadge(u) + '</td>' +
                '<td><div class="btn-group btn-group-sm">' +
                (u.role !== 'superadmin' ? '<button class="btn btn-outline-danger" onclick="changeRole(' + u.id + ", 'user')\">降为普通</button>" : '') +
                '<button class="btn btn-outline-danger" onclick="deleteUser(' + u.id + ')">删除</button>' +
                '</div></td></tr>';
        });
        html += '</tbody></table>';
        container.innerHTML = html;
    } catch(e) { container.innerHTML = '<div class="alert alert-danger">加载失败: ' + e.message + '</div>'; }
}

// ====== 操作 ======
async function changeRole(uid, role) {
    if (!confirm('确定要将此用户角色改为 "' + role + '" 吗？')) return;
    try {
        await api('/api/admin/users/' + uid + '/permissions', 'PUT', { role: role, is_approved: true });
        alert('已更新');
        loadAllUsers(); loadAdmins();
    } catch(e) { alert('失败: ' + e.message); }
}

async function approveUser(uid) {
    if (!confirm('确定通过此用户申请吗？')) return;
    try {
        await api('/api/admin/approve-user', 'POST', { user_id: uid, approved: true });
        alert('已通过');
        loadAllUsers(); loadPending();
    } catch(e) { alert('失败: ' + e.message); }
}

async function deleteUser(uid) {
    if (!confirm('确定要删除此用户吗？此操作不可撤销！')) return;
    try {
        await api('/api/admin/users/' + uid, 'DELETE');
        alert('已删除');
        loadAllUsers(); loadPending(); loadAdmins();
    } catch(e) { alert('失败: ' + e.message); }
}

// ====== 初始化 ======
if (checkAuth()) {
    loadAllUsers();
    loadPending();
    loadAdmins();
}
</script>
</body>
</html>
