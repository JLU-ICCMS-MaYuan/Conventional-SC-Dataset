/>          data/property_name_mapping.json</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-Step4-3" data-look="classic" transform="translate(215.2734375, 958)"><rect class="basic label-container" style="" x="-127.53125" y="-99" width="255.0625" height="198"/><g class="label" style="" transform="translate(-97.53125, -84)"><rect/><foreignObject width="195.0625" height="168"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p>4️⃣ 传到服务器<br />        scp backup.sql \<br />            neo4j-dump.tar.gz \<br />            data-backup.tar.gz \<br />            compose.yaml \<br />            .env \<br />            user@服务器:/opt/scwiki/</p></span></div></foreignObject></g></g></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs></svg>