" transform="translate(175.5, 742)"><rect class="basic label-container" style="" x="-130" y="-147" width="260" height="294"/><g class="label" style="" transform="translate(-100, -132)"><rect/><foreignObject width="200" height="264"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>8️⃣ 导入 Neo4j<br />        docker compose cp neo4j-dump/ neo4j:/backup/<br />        docker compose exec neo4j<br />          neo4j-admin database load neo4j<br />          --from-path=/backup/ --overwrite</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-Step9-8" data-look="classic" transform="translate(175.5, 1002)"><rect class="basic label-container" style="" x="-118.8203125" y="-63" width="237.640625" height="126"/><g class="label" style="" transform="translate(-88.8203125, -48)"><rect/><foreignObject width="177.640625" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p>9️⃣ 全部启动<br />        docker compose up -d<br />        ────────────<br />        8 个容器全部运行 ✅</p></span></div></foreignObject></g></g></g></g><g class="root" transform="translate(0, 0)"><g class="clusters"><g class="cluster" id="my-svg-Local" data-look="classic"><rect style="" x="8" y="8" width="414.546875" height="1084"/><g class="cluster-label" transform="translate(183.9296875, 8)"><foreignObject width="62.6875" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"><p>💻 开发机</p></span></div></foreignObject></g></g></g><g class="edgePaths"/><g class="edgeLabels"/><g class="nodes"><g class="node default" id="my-svg-flowchart-Step1-0" data-look="classic" transform="translate(215.2734375, 154)"><rect class="basic label-container